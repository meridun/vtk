# Regression case for the defensive progress patterns — constructed from
# winget's known bar/spinner rendering (not observed in v1.29 redirected
# captures; see header note).
[[tests.progress_spam]]
input = """
Found jq [jqlang.jq] Version 1.8.2
  -\b\\\b|\b/\b
  ██████████████████████████████  5.00 MB / 5.00 MB
Successfully installed
"""
expected = """
Found jq [jqlang.jq] Version 1.8.2
Successfully installed
"""
