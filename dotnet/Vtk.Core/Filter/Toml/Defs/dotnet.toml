# dotnet build/test — strip MSBuild restore/compile progress and the VSTest
# banner; keep compiler/analyzer warnings, the Build succeeded summary
# (warning/error counts + elapsed), and the Passed!/Failed! test summary line
# verbatim. vtk's own C#/.NET dev loop, flagged by `vtk discover` (#121);
# same "data not code" strip-def pattern as cargo.toml (#61).
#
# Capture note: vtk captures the child via pipes, so MSBuild uses the classic
# console logger (no terminal-logger rendering, no ANSI). Captured lines are
# CRLF and the pipeline splits on \n only, so each line keeps a trailing \r —
# end-anchored patterns use \r?$. MSBuild prints warnings twice on a green
# build (inline + again after "Build succeeded."); both copies are kept —
# deduping needs positional context a line-strip def doesn't have, and
# warnings are signal, not chatter.
#
# exit_codes defaults to {0}: compile errors and failing tests exit non-zero
# and pass through raw (failures always emit raw — Architecture.md
# invariant 1).

name = "dotnet"
match_command = '^dotnet (build|test)\b'

strip_lines_matching = [
  '^\s*Determining projects to restore\.\.\.\r?$',
  '^\s*All projects are up-to-date for restore\.\r?$',
  '^\s*Restored .+ \(in .+\)\.\r?$',
  '^\s+\S+ -> .+\.(dll|exe)\r?$',
  '^Test run for .+\r?$',
  '^VSTest version .+\r?$',
  '^Starting test execution, please wait\.\.\.\r?$',
  '^A total of \d+ test files matched the specified pattern\.\r?$',
  '^\s*$',
]

# Real captures from vtk's own solution (dotnet 9 SDK / VSTest 17.14.1,
# pipe-redirected). LF form here; the CRLF byte-exact originals are the
# DotnetTomlTests golden fixtures.

